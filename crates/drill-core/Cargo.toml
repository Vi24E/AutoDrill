[package]
name = "drill-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "Typed, deterministic domain engine for AutoDrill"

[features]
default = []
qa-diagnostics = []
wire-types = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12.0.1", features = ["serde-compat"], optional = true }

[dev-dependencies]
proptest.workspace = true

[[bin]]
name = "export_web_wire_types"
path = "src/bin/export_web_wire_types.rs"
required-features = ["wire-types"]

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JavaScript toolchain
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust WASM tools
        run: |
          rustup show active-toolchain
          ./scripts/install-wasm-tools.sh

      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          pnpm toolchain:check
          pnpm peers check
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /AutoDrill
          NEXT_PUBLIC_SITE_URL: https://vi24e.github.io
          NEXT_PUBLIC_DEPLOY_CHANNEL: alpha
        run: pnpm build

      - name: Verify Pages export
        run: pnpm pages:verify

      - name: Verify browser worksheet layout
        env:
          AUTODRILL_GENERATION_PROBE: 'true'
          AUTODRILL_CPU_THROTTLE_RATE: '6'
          AUTODRILL_CPU_THROTTLE_THEME_ID: '23'
        run: pnpm layout:verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

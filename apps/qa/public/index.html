<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoDrill Problem QA</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">LOCAL RESEARCH TOOL</p>
      <h1>AutoDrill Problem QA</h1>
    </div>
    <div id="status-strip" class="status-strip" aria-live="polite"></div>
  </header>
  <nav id="nav" class="nav" aria-label="QA画面">
    <button type="button" data-view="queue">評価キュー</button>
    <button type="button" data-view="history">履歴</button>
    <button type="button" data-view="sessions">セッション</button>
    <button type="button" data-view="problems">問題</button>
  </nav>
  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
